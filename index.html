<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDBUS Official Ticket Counter</title>
    <style>
        :root {
            --primary: #14b8a6;
            --primary-hover: #0d9488;
            --bg-dark: #070a0f;
            --card-bg: rgba(17, 24, 39, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --sold: #ef4444;
            --discord: #5865F2;
            --facebook: #1877F2;
            --instagram: #E1306C;
            --twitter: #1DA1F2;
            --youtube: #FF0000;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            background-image: radial-gradient(circle at top, #1e293b 0%, #070a0f 70%);
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 95%;
            max-width: 440px;
            height: 440px;
            background-image: url('images/BDBUS Group Official Logo.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.07;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 420px;
            margin-top: 10px;
            position: relative;
            z-index: 1;
        }

        .brand-section {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 15px;
        }
        .main-logo {
            width: 115px;
            height: 115px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            box-shadow: 0 0 20px rgba(20, 184, 166, 0.4);
            background: #111827;
        }

        .group-fullname {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            margin: 10px 0 2px 0;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(20, 184, 166, 0.2);
        }

        /* 🎯 গোল সোশ্যাল আইকন বাটন স্টাইল */
        .social-hubs {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 15px;
            margin-bottom: 5px;
        }
        .social-circle-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
            background-size: 55%;
            background-repeat: no-repeat;
            background-position: center;
        }
        .social-circle-btn:hover {
            transform: scale(1.1);
        }
        /* ইনলাইন SVG আইকন দিয়ে নিখুঁত কালার ও গ্লো থিম */
        .social-circle-btn.ds { 
            background-color: var(--discord); 
            box-shadow: 0 0 12px rgba(88, 101, 242, 0.4);
        }
        .social-circle-btn.fb { 
            background-color: var(--facebook); 
            box-shadow: 0 0 12px rgba(24, 119, 242, 0.4);
        }
        .social-circle-btn.ins { 
            background-color: #e1306c;
            background-image: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            box-shadow: 0 0 12px rgba(225, 48, 108, 0.4);
        }
        .social-circle-btn.x { 
            background-color: #000; 
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
        }
        .social-circle-btn svg {
            width: 22px;
            height: 22px;
            fill: white;
        }

        .greeting-text { 
            color: var(--primary); 
            font-size: 16px; 
            font-weight: 600; 
            margin-top: 15px;
            margin-bottom: -10px; 
            letter-spacing: 0.5px; 
            text-align: center; 
            width: 100%; 
        }

        .lang-switch {
            position: absolute;
            top: -5px;
            right: 0;
            display: flex;
            gap: 5px;
            background: rgba(255,255,255,0.05);
            padding: 4px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
        }
        .lang-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 5px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .lang-btn.active {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 8px var(--primary);
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px 25px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            text-align: center;
            margin-bottom: 20px;
            margin-top: 25px;
            position: relative;
        }

        h1 { color: var(--primary); margin: 0 0 5px 0; font-size: 26px; font-weight: 700; text-shadow: 0 0 15px rgba(20, 184, 166, 0.3); }
        h2 { color: var(--text-main); margin-top: 0; font-size: 22px; font-weight: 600; }
        p { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }

        .input-group {
            text-align: left;
            margin-bottom: 14px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 5px;
            padding-left: 4px;
        }
        .input-group input {
            width: 100%;
            padding: 11px 15px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(20, 184, 166, 0.2);
            background: rgba(15, 23, 42, 0.9);
        }

        .btn-premium {
            background: linear-gradient(135deg, var(--primary) 0%, #0f766e 100%);
            color: #000;
            border: none;
            width: 100%;
            padding: 13px;
            font-weight: 700;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(20, 184, 166, 0.3);
            transition: all 0.3s ease;
        }
        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(20, 184, 166, 0.5);
            background: linear-gradient(135deg, #2dd4bf 0%, var(--primary) 100%);
        }

        .toggle-link {
            color: var(--primary);
            font-size: 13px;
            margin-top: 18px;
            display: inline-block;
            cursor: pointer;
            text-decoration: none;
        }
        .toggle-link:hover { text-decoration: underline; }

        /* 🎯 ব্যাক বাটন নিখুঁত পজিশন ও অ্যাকশন স্টাইল */
        .back-btn-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 12px;
        }
        .back-link-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.2s;
        }
        .back-link-btn:hover {
            color: #fff;
        }

        #counterPage { display: none; }
        
        .status-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
        }
        .status-item { display: flex; align-items: center; gap: 8px; }
        .dot { width: 14px; height: 14px; border-radius: 4px; }
        .dot.available { background-color: #1e293b; border: 1px solid #475569; }
        .dot.selected { background-color: var(--primary); box-shadow: 0 0 8px var(--primary); }
        .dot.sold { background-color: var(--sold); }

        .bus-layout {
            background: rgba(10, 15, 26, 0.8);
            padding: 22px 18px;
            border-radius: 16px;
            border: 1px solid rgba(20, 184, 166, 0.2);
            display: grid;
            grid-template-columns: repeat(4, 55px);
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .bus-layout button:nth-child(4n-2) { margin-right: 30px; }
        
        .seat {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            color: #cbd5e1;
            border: 1px solid rgba(255,255,255,0.1);
            height: 42px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .seat:hover:not(.sold):not(.selected) { border-color: var(--primary); color: #fff; }
        .seat.selected {
            background: linear-gradient(180deg, var(--primary) 0%, #0f766e 100%);
            color: #000;
            border-color: var(--primary);
            font-weight: 700;
            box-shadow: 0 0 12px rgba(20, 184, 166, 0.4);
        }
        .seat.sold {
            background: linear-gradient(180deg, #3f3f46 0%, #18181b 100%);
            color: #71717a;
            border-color: transparent;
            cursor: not-allowed;
        }

        #ticketPage {
            display: none;
            background: radial-gradient(circle at top, #111827 0%, #030712 100%);
            border: 2px dashed rgba(20, 184, 166, 0.4);
            padding: 25px;
            border-radius: 16px;
            text-align: left;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        }
        .ticket-header { text-align: center; color: var(--primary); font-size: 22px; font-weight: 800; margin-bottom: 15px; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 12px; letter-spacing: 1px; }
        .ticket-info { font-size: 15px; margin: 10px 0; color: #e2e8f0; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.02); padding-bottom: 6px; }
        .ticket-info span.lbl { color: #cbd5e1; }
        .ticket-info span.val { color: var(--primary); font-weight: 600; text-align: right; max-width: 60%; word-break: break-all; }

        /* 👑 ডেভলপার কার্ড ও ডাবল কলাম বাটন */
        .dev-credit-container {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .dev-header-info {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
            justify-content: center;
            margin-bottom: 12px;
        }
        .dev-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 1px solid var(--primary);
            box-shadow: 0 0 10px rgba(20, 184, 166, 0.3);
            object-fit: cover;
        }
        .dev-title-text p { margin: 0; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .dev-title-text h4 { margin: 2px 0 0 0; font-size: 16px; color: #fff; font-weight: 700; }
        
        /* 🎯 ইউটিউব চ্যানেলের নতুন ২-লাইন সাবস্ক্রাইব বাটন ডিজাইন */
        .dev-channels {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            width: 100%;
        }
        .yt-btn {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            box-sizing: border-box;
            text-align: left;
        }
        .yt-btn img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.4);
        }
        .yt-btn .btn-text-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .yt-btn .channel-name {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.3px;
            line-height: 1.2;
        }
        .yt-btn .sub-text {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.75);
            margin-top: 1px;
        }
        .yt-btn:hover { 
            transform: translateY(-2px); 
        }
        .yt-btn.main-yt { 
            background: linear-gradient(135deg, #FF0000 0%, #b91c1c 100%); 
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.25); 
        }
        .yt-btn.secondary-yt { 
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%); 
            box-shadow: 0 4px 15px rgba(185, 28, 28, 0.25); 
        }

        .custom-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #111827;
            border: 2px solid var(--primary);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            z-index: 9999;
            text-align: center;
            width: 280px;
        }
        .custom-popup p { color: #fff; font-weight: bold; margin-bottom: 15px; }
        .custom-popup button {
            background: var(--primary);
            border: none;
            padding: 6px 18px;
            border-radius: 5px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }
        .privacy-footer {
            margin-top: 20px;
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
    </style>
</head>
<body>

    <div id="upcomingPopup" class="custom-popup">
        <p id="popupMsg">Up Coming...</p>
        <button onclick="closePopup()">OK</button>
    </div>

    <div class="container">
        <div class="lang-switch">
            <button class="lang-btn active" id="btnEn" onclick="changeLanguage('en')">EN</button>
            <button class="lang-btn" id="btnBn" onclick="changeLanguage('bn')">বাংলা</button>
        </div>

        <div class="brand-section">
            <img class="main-logo" src="images/BDBUS Group Official Logo.png" alt="BDBUS Logo">
            <div class="group-fullname" id="gName">Bangladesh Bussid Unique Society</div>
            
            <div class="social-hubs">
                <a href="https://discord.gg/C7jnVua2Tp" target="_blank" class="social-circle-btn ds" title="Discord">

                </a>
                <a href="https://facebook.com/groups/771005197556072/" target="_blank" class="social-circle-btn fb" title="Facebook">

                </button>
                <button onclick="showUpcoming()" class="social-circle-btn x" title="X (Twitter)">

                </button>
            </div>
        </div>

        <div id="timeGreeting" class="greeting-text">Welcome to BDBUS Panel</div>

        <div id="authPage">
            <div class="glass-card" id="loginBox">
                <h2 id="lTitle">Player Login</h2>
                <p id="lDesc">Please login to book your bus seat</p>
                
                <div class="input-group">
                    <label id="lEmailLabel">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="example@mail.com">
                </div>
                <div class="input-group">
                    <label id="lPassLabel">Password</label>
                    <input type="password" id="loginPass" placeholder="••••••••">
                </div>
                
                <button class="btn-premium" id="lBtn" onclick="handleLogin()">Login Now</button>
                <span class="toggle-link" id="lToggle" onclick="toggleAuth(false)">
