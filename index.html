<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDBUS PANEL</title>
    <style>
        body { background: #0b111e; color: white; font-family: sans-serif; margin: 0; padding: 0; }
        .navbar { display: flex; justify-content: space-between; padding: 15px 20px; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); align-items: center; }
        .menu-bar a { color: white; margin-left: 15px; text-decoration: none; cursor: pointer; }
        .container { max-width: 420px; margin: 20px auto; padding: 20px; }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        button { background: #00bfa5; color: white; cursor: pointer; }
        #authSection, #homeSection, #adminPanel { display: none; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo">BDBUS PANEL</div>
    <div class="menu-bar" id="menuBar" style="display:none;">
        <a onclick="showSection('homeSection')">Home</a>
        <a onclick="alert('Profile Details...')">My Profile</a>
        <a onclick="showSection('adminPanel')">Admin Panel</a>
        <a onclick="location.reload()">Logout</a>
    </div>
</nav>

<div class="container" id="authSection" style="display:block;">
    <h2>Please login to book your bus seat</h2>
    <input type="email" id="email" placeholder="Email Address">
    <input type="password" id="pass" placeholder="Password">
    <button onclick="login()">Login Now</button>
    <button onclick="alert('Signup logic here')">Sign Up</button>
</div>

<div class="container" id="homeSection">
    <h2>Issue Ticket</h2>
    <input type="text" id="from" placeholder="From">
    <input type="text" id="to" placeholder="To">
    <input type="date" id="jDate">
    <input type="time" id="jTime">
    <button onclick="alert('Ticket Issued!')">Issue Ticket</button>
</div>

<div class="container" id="adminPanel">
    <h2>Admin Panel</h2>
    <p>Manage bookings here.</p>
</div>

<script>
    function showSection(id) {
        document.getElementById('authSection').style.display = 'none';
        document.getElementById('homeSection').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById(id).style.display = 'block';
    }

    function login() {
        document.getElementById('menuBar').style.display = 'block';
        showSection('homeSection');
    }
</script>

</body>
</html>
