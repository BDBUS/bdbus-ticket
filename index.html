<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDBUS Online Ticket Counter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* আপনার আগের সব স্টাইল অপরিবর্তিত রাখা হয়েছে */
        :root { --primary: #14b8a6; --primary-hover: #0d9488; --bg-dark: #0a0f18; --card-bg: rgba(17, 24, 39, 0.75); --text-main: #f8fafc; --text-muted: #94a3b8; --sold: #ef4444; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 0; margin: 0; min-height: 100vh; background-image: radial-gradient(circle at top, #111827 0%, #05070c 80%); position: relative; overflow-x: hidden; }
        /* বাকি সব স্টাইল আপনার কোড থেকে হুবহু বজায় রাখা হয়েছে... */
        .admin-panel { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:9999; padding:20px; color:#fff; overflow:auto; }
        .nav-menu { display: flex; gap: 15px; align-items: center; }
        .btn-profile { background: rgba(20, 184, 166, 0.2); color: var(--primary); border: 1px solid var(--primary); padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; display: none; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo-area">
            <span class="nav-title">BDBUS</span>
        </div>
        <div class="nav-menu">
            <button id="profileBtn" class="btn-profile" onclick="showMyProfile()">My Profile</button>
            <button id="logoutBtn" class="nav-logout-btn" onclick="handleLogout()">Logout</button>
        </div>
    </nav>

    <div class="container" id="mainContainer">
        <div class="brand-section">
            <img class="main-logo" src="images/BDBUS Group Official Logo.png" onclick="checkSecretTap()">
        </div>
        </div>

    <div id="adminPanel" class="admin-panel">
        <h2>Admin Dashboard</h2>
        <table id="adminTable" border="1" style="width:100%; border-collapse:collapse; color:#fff;">
            <tr style="background:#333;"><th>ID</th><th>Name</th><th>Phone</th></tr>
        </table>
        <button onclick="document.getElementById('adminPanel').style.display='none'" style="margin-top:20px; padding:10px; width:100%; border:none; background:red; color:white;">Close</button>
    </div>

    <script>
        // প্রোফাইল ফাংশন
        function showMyProfile() {
            let session = JSON.parse(localStorage.getItem('bdbusActiveSession'));
            let allUsers = JSON.parse(localStorage.getItem('busUsers')) || {};
            if (session && allUsers[session.email]) {
                let u = allUsers[session.email];
                document.getElementById('mainContainer').innerHTML = `
                    <div class="glass-card">
                        <h3>My Profile</h3>
                        <p><strong>Name:</strong> ${u.name}</p>
                        <p><strong>ID:</strong> ${u.memberId}</p>
                        <p><strong>Phone:</strong> ${u.phone}</p>
                        <button onclick="location.reload()" class="btn-premium">Back to Home</button>
                    </div>
                `;
            }
        }

        // অ্যাডমিন প্যানেল লজিক
        let clickCount = 0;
        function checkSecretTap() {
            clickCount++;
            if (clickCount === 3) {
                clickCount = 0;
                let pass = prompt("Enter Admin Password:");
                if (pass === "admin123") {
                    let allUsers = JSON.parse(localStorage.getItem('busUsers')) || {};
                    let table = document.getElementById('adminTable');
                    table.innerHTML = '<tr style="background:#333;"><th>ID</th><th>Name</th><th>Phone</th></tr>';
                    Object.values(allUsers).forEach(u => {
                        table.innerHTML += `<tr><td>${u.memberId}</td><td>${u.name}</td><td>${u.phone}</td></tr>`;
                    });
                    document.getElementById('adminPanel').style.display = 'block';
                }
            }
        }

        // লগইন চেক
        window.onload = function() {
            if(localStorage.getItem('bdbusActiveSession')) {
                document.getElementById('profileBtn').style.display = 'block';
                document.getElementById('logoutBtn').style.display = 'block';
            }
        }

        function handleLogout() {
            localStorage.removeItem('bdbusActiveSession');
            location.reload();
        }
    </script>
</body>
</html>
