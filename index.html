<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDBUS ONLINE TICKET COUNTER</title>
    <style>
        body { background: #0b111e; color: white; font-family: sans-serif; margin: 0; padding: 20px; text-align: center; }
        /* ওয়াটারমার্ক লোগো */
        body::before { 
            content: ""; position: fixed; top: 20%; left: 10%; width: 80%; height: 60%; 
            background-image: url('images/BDBUS Group Official Logo.png'); 
            background-repeat: no-repeat; background-position: center; background-size: contain;
            opacity: 0.1; z-index: -1; 
        }
        .lang-switch { text-align: right; margin-bottom: 10px; }
        .top-logo { width: 60px; height: 60px; border-radius: 50%; margin: 10px 0; border: 2px solid #00bfa5; }
        .clock-box { background: #1a2234; padding: 15px; border-radius: 10px; border: 1px solid #333; margin: 20px 0; }
        .login-box { background: #1a2234; padding: 20px; border-radius: 15px; border: 1px solid #00bfa5; max-width: 400px; margin: auto; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #0b111e; color: white; }
        button { width: 95%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-login { background: #00bfa5; color: #0b111e; }
        .btn-signup { background: transparent; border: 1px solid #00bfa5; color: white; }
        .footer-card { background: #1a2234; padding: 15px; border-radius: 10px; margin-top: 20px; border: 1px solid #333; }
        .sub-btn { background: #e53935; color: white; border: none; padding: 8px 10px; border-radius: 5px; margin: 5px; font-size: 12px; }
    </style>
</head>
<body>

<div class="lang-switch"><button style="width:auto; background:#00bfa5;">EN</button> বাংলা</div>

<img src="images/BDBUS Group Official Logo.png" class="top-logo" alt="Logo">
<h2>BDBUS ONLINE TICKET COUNTER</h2>
<p style="color:#00bfa5;">Bangladesh Bussid Unique Society</p>

<div class="clock-box">
    <p>Good Night! 🌌</p>
    <h2 id="clock">11:39:34 PM</h2>
    <p>LIVE DATE: SUN, JUN 7, 2026</p>
</div>

<div class="login-box">
    <h3>Please login to book your bus seat</h3>
    <input type="email" placeholder="example@mail.com">
    <input type="password" placeholder="********">
    <button class="btn-login">Login Now</button>
    <button class="btn-signup">Sign Up</button>
</div>

<p style="margin-top:20px;">FB YT IG X DC ✉️</p>
<p>Privacy Policy | Terms & Conditions | Refund Policy</p>

<div class="footer-card">
    <p>WEBSITE CREATED BY</p>
    <h3>M2Vai</h3>
    <button class="sub-btn">M2Vai Subscribe Now</button>
    <button class="sub-btn">Traveller Subscribe Now</button>
</div>

<script>
    function updateClock() {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
</script>

</body>
</html>
