<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDBUS Official Website - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; position: relative; }
        
        /* ওয়াটারমার্ক */
        .watermark { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70%; max-width: 500px; opacity: 0.05; pointer-events: none; z-index: 0; }
        
        /* ভাষা সেটিং */
        .lang-container { position: absolute; top: 20px; right: 20px; z-index: 10; font-weight: bold; }
        .lang-btn { cursor: pointer; color: #333; text-decoration: none; padding: 5px; }
        .lang-btn.active { color: #ff5722; }

        /* লগইন কার্ড */
        .login-card { background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; z-index: 5; position: relative; }
        .logo { width: 80px; margin-bottom: 15px; }
        h1 { font-size: 20px; color: #1a1a1a; margin-bottom: 5px; font-weight: bold; }
        h2 { font-size: 14px; color: #555; margin-bottom: 25px; letter-spacing: 1px; }
        
        /* ইনপুট ফিল্ড */
        .input-group { margin-bottom: 20px; text-align: left; position: relative; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #333; font-weight: 600; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; outline: none; }
        .input-group input:focus { border-color: #ff5722; }
        
        /* পাসওয়ার্ড শো/হাইড */
        .toggle-password { position: absolute; right: 12px; top: 38px; cursor: pointer; color: #666; font-size: 14px; user-select: none; }
        
        .forget-pwd { display: block; text-align: right; font-size: 13px; color: #ff5722; text-decoration: none; margin-bottom: 25px; }
        
        /* বাটন গ্রুপ */
        .btn-group { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 5px; font-size: 15px; font-weight: bold; cursor: pointer; text-decoration: none; transition: 0.3s; }
        .btn-login { background-color: #ff5722; color: white; }
        .btn-login:hover { background-color: #e64a19; }
        .btn-register { background-color: #e0e0e0; color: #333; }
        .btn-register:hover { background-color: #d5d5d5; }
    </style>
</head>
<body>

    <!-- ওয়াটারমার্ক লোগো -->
    <img src="images/BDBUS Group Official Logo.png" alt="BDBUS Watermark" class="watermark">

    <!-- ভাষা পরিবর্তনকারী -->
    <div class="lang-container">
        <span id="lang-en" class="lang-btn active" onclick="changeLang('en')">EN</span> | 
        <span id="lang-bn" class="lang-btn" onclick="changeLang('bn')">বাংলা</span>
    </div>

    <!-- লগইন ফর্ম কার্ড -->
    <div class="login-card">
        <img src="images/BDBUS Group Official Logo.png" alt="BDBUS Logo" class="logo">
        <h1 id="txt-title">Bangladesh Bussid Unique Society</h1>
        <h2 id="txt-subtitle">BDBUS OFFICIAL WEBSITE</h2>

        <form onsubmit="event.preventDefault(); alert('Login feature is under development.');">
            <div class="input-group">
                <label id="lbl-email" for="email">Email Address</label>
                <input type="email" id="email" placeholder="example@email.com" required>
            </div>
            
            <div class="input-group">
                <label id="lbl-pass" for="password">Password</label>
                <input type="password" id="password" required>
                <span class="toggle-password" id="txt-toggle" onclick="togglePassword()">Show</span>
            </div>

            <a href="#" class="forget-pwd" id="txt-forget">Forget password?</a>

            <div class="btn-group">
                <button type="submit" class="btn btn-login" id="btn-login">Login Now</button>
                <a href="register.html" class="btn btn-register" id="btn-register">Registration Now</a>
            </div>
        </form>
    </div>

    <script>
        function togglePassword() {
            var pwdInput = document.getElementById("password");
            var toggleText = document.getElementById("txt-toggle");
            var currentLang = document.getElementById("lang-bn").classList.contains("active") ? 'bn' : 'en';

            if (pwdInput.type === "password") {
                pwdInput.type = "text";
                toggleText.innerText = currentLang === 'bn' ? "লুকান" : "Hide";
            } else {
                pwdInput.type = "password";
                toggleText.innerText = currentLang === 'bn' ? "দেখান" : "Show";
            }
        }

        function changeLang(lang) {
            var enBtn = document.getElementById("lang-en");
            var bnBtn = document.getElementById("lang-bn");
            var toggleText = document.getElementById("txt-toggle");
            var pwdInput = document.getElementById("password");

            if(lang === 'en') {
                enBtn.classList.add("active");
                bnBtn.classList.remove("active");
                document.getElementById("txt-title").innerText = "Bangladesh Bussid Unique Society";
                document.getElementById("txt-subtitle").innerText = "BDBUS OFFICIAL WEBSITE";
                document.getElementById("lbl-email").innerText = "Email Address";
                document.getElementById("lbl-pass").innerText = "Password";
                document.getElementById("txt-forget").innerText = "Forget password?";
                document.getElementById("btn-login").innerText = "Login Now";
                document.getElementById("btn-register").innerText = "Registration Now";
                toggleText.innerText = pwdInput.type === "password" ? "Show" : "Hide";
            } else {
                bnBtn.classList.add("active");
                enBtn.classList.remove("active");
                document.getElementById("txt-title").innerText = "বাংলাদেশ বাসআইডি ইউনিক সোসাইটি";
                document.getElementById("txt-subtitle").innerText = "বিডিবাস অফিসিয়াল ওয়েবসাইট";
                document.getElementById("lbl-email").innerText = "ইমেইল এড্রেস";
                document.getElementById("lbl-pass").innerText = "পাসওয়ার্ড";
                document.getElementById("txt-forget").innerText = "পাসওয়ার্ড ভুলে গেছেন?";
                document.getElementById("btn-login").innerText = "লগইন করুন";
                document.getElementById("btn-register").innerText = "নিবন্ধন করুন";
                toggleText.innerText = pwdInput.type === "password" ? "দেখান" : "লুকান";
            }
        }
    </script>
</body>
</html>
