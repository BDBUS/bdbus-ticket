<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDBUS ONLINE TICKET COUNTER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b111e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .logo-section {
            margin-bottom: 25px;
        }

        .logo-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #00f2fe;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0b111e;
            overflow: hidden;
        }

        .logo-circle img {
            width: 90%;
            height: auto;
        }

        h2 {
            font-size: 20px;
            color: #00f2fe;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        p.subtitle {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 25px;
        }

        .lang-switch {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .lang-btn {
            background-color: #1f2937;
            color: #fff;
            border: none;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        .lang-btn.active {
            background-color: #00f2fe;
            color: #0b111e;
            font-weight: bold;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 16px;
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .input-wrapper input:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 8px rgba(0, 242, 254, 0.2);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-reg {
            background: linear-gradient(135deg, #ec4899, #f43f5e);
            color: white;
        }

        .btn-login {
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #0b111e;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Message Box Stylings */
        .alert-box {
            display: none;
            background-color: #ef4444;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="lang-switch">
            <button class="lang-btn active" id="btn-bn" onclick="switchLang('bn')">বাংলা</button>
            <button class="lang-btn" id="btn-en" onclick="switchLang('en')" style="margin-left: 5px;">English</button>
        </div>

        <div class="logo-section">
            <div class="logo-circle">
                <img src="images/BDBUS Group Official Logo.png" alt="BDBUS LOGO" onerror="this.src='https://via.placeholder.com/100?text=BDBUS'">
            </div>
            <h2 id="txt-title">BDBUS ONLINE TICKET COUNTER</h2>
            <p class="subtitle" id="txt-subtitle">Bangladesh Bussid Unique Society</p>
        </div>

        <div class="alert-box" id="error-alert"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label id="lbl-email">ইমেইল এড্রেস</label>
                <div class="input-wrapper">
                    <input type="email" id="email" required placeholder="example@mail.com">
                </div>
            </div>

            <div class="form-group" id="pass-field-group">
                <label id="lbl-pass">পাসওয়ার্ড</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••">
                </div>
            </div>

            <div class="btn-group">
                <button type="button" class="btn btn-reg" id="btn-reg-text" onclick="handleRegister()">রেজিস্ট্রেশন করুন</button>
                <button type="submit" class="btn btn-login" id="btn-login-text">লগইন করুন</button>
            </div>
        </form>
    </div>

    <script>
        // ভাষা পরিবর্তন ট্র্যাকিং
        let currentLang = 'bn';
        const emailInput = document.getElementById('email');
        const passFieldGroup = document.getElementById('pass-field-group');

        const languages = {
            bn: {
                title: "BDBUS ONLINE TICKET COUNTER",
                subtitle: "Bangladesh Bussid Unique Society",
                email: "ইমেইল এড্রেস",
                pass: "পাসওয়ার্ড",
                reg: "রেজিস্ট্রেশন করুন",
                login: "লগইন করুন",
                errEmail: "অনুগ্রহ করে সঠিক ইমেইল আইডি দিন।",
                errMatch: "ভুল ইমেইল অথবা পাসওয়ার্ড দেওয়া হয়েছে।"
            },
            en: {
                title: "BDBUS ONLINE TICKET COUNTER",
                subtitle: "Bangladesh Bussid Unique Society",
                email: "Email Address",
                pass: "Password",
                reg: "Register Now",
                login: "Login Now",
                errEmail: "Please enter a valid email address.",
                errMatch: "Invalid email address or credential password match."
            }
        };

        // মেইন এডমিন ইমেইল ট্র্যাকিং (এর জন্য পাসওয়ার্ড লাগবে না)
        emailInput.addEventListener('input', function() {
            if (this.value.trim() === "info.m2vai380@gmail.com") {
                passFieldGroup.style.display = 'none'; // এডমিন ইমেইল হলে পাসওয়ার্ড ফিল্ড লুকিয়ে যাবে
                document.getElementById('password').required = false;
            } else {
                passFieldGroup.style.display = 'block'; // সাধারণ ইমেইল হলে পাসওয়ার্ড লাগবে
            }
        });

        function switchLang(lang) {
            currentLang = lang;
            document.getElementById('btn-bn').classList.toggle('active', lang === 'bn');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            
            document.getElementById('txt-title').innerText = languages[lang].title;
            document.getElementById('txt-subtitle').innerText = languages[lang].subtitle;
            document.getElementById('lbl-email').innerText = languages[lang].email;
            document.getElementById('lbl-pass').innerText = languages[lang].pass;
            document.getElementById('btn-reg-text').innerText = languages[lang].reg;
            document.getElementById('btn-login-text').innerText = languages[lang].login;
        }

        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('error-alert');

            alertBox.style.display = 'none';

            // ১. মেইন এডমিন চেক (কোনো পাসওয়ার্ড লাগবে না)
            if (email === "info.m2vai380@gmail.com") {
                // সরাসরি সফল লগইন (এডমিন প্যানেলে রিডাইরেক্ট)
                window.location.href = "m2vai-panel.html"; 
                return;
            }

            // ২. সাধারণ ডেমো মেম্বার অ্যাকাউন্ট চেক (পাসওয়ার্ডসহ)
            if (email === "emon@mail.com" && password === "password") {
                window.location.href = "member-panel.html";
                return;
            }

            // ৩. LocalStorage থেকে ইউজার ডাটা চেক (যদি কেউ সাইন-আপ করে থাকে)
            let users = JSON.parse(localStorage.getItem('bdbus_users')) || [];
            let foundUser = users.find(u => u.email === email && u.password === password);

            if (foundUser) {
                window.location.href = "member-panel.html";
            } else {
                alertBox.innerText = languages[currentLang].errMatch;
                alertBox.style.display = 'block';
            }
        }

        function handleRegister() {
            // রেজিস্ট্রেশন পেজ বা পপআপ থাকলে সেখানে রিডাইরেক্ট করতে পারেন
            alert(currentLang === 'bn' ? "রেজিস্ট্রেশন ফিচারটি সাময়িকভাবে লোকাল স্টোরেজে কাজ করবে। কোড আপডেট সম্পন্ন।" : "Registration feature is ready via LocalStorage.");
            
            // ডেমো হিসেবে একটি নতুন মেম্বার রেজিস্ট্রেশন ডাটা তৈরি করে দেওয়া (টেস্ট করার সুবিধার্থে)
            let users = JSON.parse(localStorage.getItem('bdbus_users')) || [];
            if(!users.some(u => u.email === "test@mail.com")) {
                users.push({email: "test@mail.com", password: "123"});
                localStorage.setItem('bdbus_users', JSON.stringify(users));
            }
        }
    </script>
</body>
</html>
