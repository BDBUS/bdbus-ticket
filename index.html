<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDBUS Online Ticket Counter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* আপনার বর্তমান সব স্টাইল এখানে বিদ্যমান */
        :root { --primary: #14b8a6; --bg-dark: #0a0f18; --card-bg: rgba(17, 24, 39, 0.75); --text-main: #f8fafc; --sold: #ef4444; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; }
        .navbar { width: 100%; padding: 15px; background: rgba(0,0,0,0.5); display: flex; justify-content: space-between; align-items: center; }
        .container { width: 100%; max-width: 420px; padding: 20px; }
        .main-logo { width: 110px; height: 110px; border-radius: 50%; cursor: pointer; border: 2px solid var(--primary); }
        .glass-card { background: var(--card-bg); padding: 20px; border-radius: 15px; margin-top: 20px; }
        .btn-premium { background: var(--primary); color: #000; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .admin-panel { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:9999; padding:20px; color:#fff; overflow:auto; }
    </style>
</head>
<body>

    <nav class="navbar">
        <span>BDBUS PANEL</span>
        <div id="navMenu" style="display:flex; gap:10px;">
            <button id="profileBtn" onclick="showMyProfile()" style="display:none; background:none; border:1px solid var(--primary); color:white; padding:5px 10px; border-radius:5px;">Profile</button>
            <button id="logoutBtn" onclick="handleLogout()" style="display:none; background:red; color:white; border:none; padding:5px 10px;">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div style="text-align: center;">
            <img class="main-logo" src="images/BDBUS Group Official Logo.png" onclick="checkSecretTap()" onerror="this.style.background='#333'">
            <h3>BDBUS Online Counter</h3>
        </div>

        <div id="appContainer" class="glass-card">
            <p>Welcome! Please login to continue.</p>
        </div>
    </div>

    <div id="adminPanel" class="admin-panel">
        <h2>Admin Dashboard</h2>
        <table id="adminTable" border="1" style="width:100%; border-collapse:collapse; color:#fff; margin-bottom:20px;">
            <tr style="background:#333;"><th>ID</th><th>Name</th><th>Phone</th></tr>
        </table>
        <button onclick="document.getElementById('adminPanel').style.display='none'" style="padding:15px; background:red; color:white; border:none; width:100%;">Close Panel</button>
    </div>

    <script>
        // ১. প্রোফাইল লজিক
        function showMyProfile() {
            let session = JSON.parse(localStorage.getItem('bdbusActiveSession'));
            let allUsers = JSON.parse(localStorage.getItem('busUsers')) || {};
            if (session && allUsers[session.email]) {
                let u = allUsers[session.email];
                document.getElementById('appContainer').innerHTML = `
                    <div class="glass-card">
                        <h3>My Profile</h3>
                        <p><strong>Name:</strong> ${u.name}</p>
                        <p><strong>ID:</strong> ${u.memberId}</p>
                        <p><strong>Phone:</strong> ${u.phone}</p>
                        <button onclick="location.reload()" class="btn-premium">Back to Home</button>
                    </div>
                `;
            }
        }

        // ২. সিক্রেট অ্যাডমিন প্যানেল (লোগোতে ৩ বার ক্লিক)
        let clickCount = 0;
        function checkSecretTap() {
            clickCount++;
            if (clickCount === 3) {
                clickCount = 0;
                let pass = prompt("Enter Admin Password:");
                if (pass === "admin123") {
                    let allUsers = JSON.parse(localStorage.getItem('busUsers')) || {};
                    let table = document.getElementById('adminTable');
                    table.innerHTML = '<tr style="background:#333;"><th>ID</th><th>Name</th><th>Phone</th></tr>';
                    Object.values(allUsers).forEach(u => {
                        table.innerHTML += `<tr><td>${u.memberId}</td><td>${u.name}</td><td>${u.phone}</td></tr>`;
                    });
                    document.getElementById('adminPanel').style.display = 'block';
                }
            }
        }

        // ৩. লগইন চেক
        window.onload = function() {
            if(localStorage.getItem('bdbusActiveSession')) {
                document.getElementById('profileBtn').style.display = 'block';
                document.getElementById('logoutBtn').style.display = 'block';
            }
        }

        function handleLogout() {
            localStorage.removeItem('bdbusActiveSession');
            location.reload();
        }
    </script>
</body>
</html>
